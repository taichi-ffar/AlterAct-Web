<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080d18">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AlterAct</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <section id="loading" aria-live="polite">
        <strong>ALTERACT</strong>
        <div id="progress-track"><div id="progress-fill"></div></div>
        <span>因果律へ接続中…</span>
      </section>
      <div id="unity-warning"></div>
      <button id="fullscreen-button" type="button" aria-label="全画面表示">⛶</button>
    </main>
    <script src="Build/a5bbb411e932b23429650e195b79725f.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#loading");
      const progress = document.querySelector("#progress-fill");
      const fullscreenButton = document.querySelector("#fullscreen-button");

      function currentFullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }

      function updateFullscreenButton() {
        const active = Boolean(currentFullscreenElement());
        fullscreenButton.textContent = active ? "↙" : "⛶";
        fullscreenButton.setAttribute("aria-label", active ? "全画面を解除" : "全画面表示");
        fullscreenButton.setAttribute("aria-pressed", active ? "true" : "false");
        fullscreenButton.title = active ? "全画面を解除" : "全画面表示";
      }

      function showBanner(message, type) {
        const warning = document.querySelector("#unity-warning");
        warning.textContent = message;
        warning.dataset.type = type || "warning";
        warning.hidden = false;
        if (type !== "error") setTimeout(() => warning.hidden = true, 5000);
      }

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/cd4e2d3ba7227187ae4ec4b296031c4d.data.unityweb",
        frameworkUrl: "Build/19e30bf74e80938fb756437d3b88e518.framework.js.unityweb",
        codeUrl: "Build/2f616111a67f3dfc8b242302c160d56c.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "taichi-ffar",
        productName: "AlterAct",
        productVersion: "0.9.0",
        devicePixelRatio: Math.min(
          window.devicePixelRatio || 1,
          (navigator.maxTouchPoints || 0) > 0 ? 3 : 2
        ),
        showBanner
      }, value => progress.style.width = `${Math.round(value * 100)}%`)
        .then(unityInstance => {
          loading.hidden = true;
          fullscreenButton.addEventListener("click", async () => {
            const active = Boolean(currentFullscreenElement());
            if (active) {
              try {
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if (exit) await exit.call(document);
              } catch (_) {}
              try { unityInstance.SetFullscreen(0); } catch (_) {}
            } else {
              try {
                const request = document.documentElement.requestFullscreen ||
                                document.documentElement.webkitRequestFullscreen;
                if (request) await request.call(document.documentElement);
              } catch (_) {}
              try { unityInstance.SetFullscreen(1); } catch (_) {}
            }
            updateFullscreenButton();
          });
          document.addEventListener("fullscreenchange", updateFullscreenButton);
          document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
          updateFullscreenButton();
        })
        .catch(message => showBanner(message, "error"));
    </script>
  </body>
</html>
