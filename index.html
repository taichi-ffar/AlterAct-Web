<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080d18">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AlterAct</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <section id="loading" aria-live="polite">
        <strong>ALTERACT</strong>
        <div id="progress-track"><div id="progress-fill"></div></div>
        <span>因果律へ接続中…</span>
      </section>
      <div id="unity-warning"></div>
      <button id="fullscreen-button" type="button" aria-label="全画面表示">⛶</button>
    </main>
    <script src="Build/a568293dbf88c9641e3560cef985c0e3.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#loading");
      const progress = document.querySelector("#progress-fill");
      const fullscreenButton = document.querySelector("#fullscreen-button");
      const touchDevice = (navigator.maxTouchPoints || 0) > 0;
      const browserPixelRatio = window.devicePixelRatio || 1;
      // Some Android WebViews report a low DPR on high-density displays.
      // Keep touch rendering at least 2x while capping memory consumption.
      const unityPixelRatio = touchDevice
        ? Math.min(4, Math.max(2, browserPixelRatio))
        : Math.min(2, browserPixelRatio);
      let fullscreenRequested = false;
      let fullscreenTogglePending = false;

      function currentFullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }

      function updateFullscreenButton() {
        const active = Boolean(currentFullscreenElement()) || fullscreenRequested;
        fullscreenButton.textContent = active ? "↙" : "⛶";
        fullscreenButton.setAttribute("aria-label", active ? "全画面を解除" : "全画面表示");
        fullscreenButton.setAttribute("aria-pressed", active ? "true" : "false");
        fullscreenButton.title = active ? "全画面を解除" : "全画面表示";
      }

      function showBanner(message, type) {
        const warning = document.querySelector("#unity-warning");
        warning.textContent = message;
        warning.dataset.type = type || "warning";
        warning.hidden = false;
        if (type !== "error") setTimeout(() => warning.hidden = true, 5000);
      }

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/37408e120dabfeb66d10a0c919d3ae2b.data.unityweb",
        frameworkUrl: "Build/96b31d5b64820d3850b9a0e9b32b0917.framework.js.unityweb",
        codeUrl: "Build/75dfbd4ab8177e2bb25aae2657f53327.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "taichi-ffar",
        productName: "AlterAct",
        productVersion: "0.9.0",
        devicePixelRatio: unityPixelRatio,
        showBanner
      }, value => progress.style.width = `${Math.round(value * 100)}%`)
        .then(unityInstance => {
          loading.hidden = true;
          fullscreenButton.addEventListener("click", async () => {
            const active = Boolean(currentFullscreenElement()) || fullscreenRequested;
            fullscreenTogglePending = true;
            fullscreenRequested = !active;
            if (active) {
              try {
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if (exit) await exit.call(document);
              } catch (_) {}
              try { unityInstance.SetFullscreen(0); } catch (_) {}
            } else {
              try {
                const request = document.documentElement.requestFullscreen ||
                                document.documentElement.webkitRequestFullscreen;
                if (request) await request.call(document.documentElement);
              } catch (_) {}
              try { unityInstance.SetFullscreen(1); } catch (_) {}
            }
            updateFullscreenButton();
            setTimeout(() => fullscreenTogglePending = false, 250);
          });
          const handleFullscreenChange = () => {
            if (currentFullscreenElement()) fullscreenRequested = true;
            else if (!fullscreenTogglePending) fullscreenRequested = false;
            updateFullscreenButton();
          };
          document.addEventListener("fullscreenchange", handleFullscreenChange);
          document.addEventListener("webkitfullscreenchange", handleFullscreenChange);
          updateFullscreenButton();
        })
        .catch(message => showBanner(message, "error"));
    </script>
  </body>
</html>
